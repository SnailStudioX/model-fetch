<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Primary gradient: WeChat green -->
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07c160"/>
      <stop offset="100%" stop-color="#06ad56"/>
    </linearGradient>

    <!-- Surface gradient: matches app light theme -->
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>

    <!-- Subtle glow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#surface)"/>

  <!-- Subtle border -->
  <rect x="5" y="5" width="502" height="502" rx="103" fill="none" stroke="#d4d4d4" stroke-width="4" opacity="0.8"/>

  <!-- M letterform with glow -->
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <rect x="112" y="96" width="88" height="320" rx="20" fill="url(#primary)"/>

    <!-- Right vertical bar -->
    <rect x="312" y="96" width="88" height="320" rx="20" fill="url(#primary)"/>

    <!-- Center V: endpoints buried in the pillars for a seamless join -->
    <path d="M156 136 L256 296 L356 136" fill="none" stroke="url(#primary)" stroke-width="80" stroke-linejoin="round"/>
  </g>
</svg>
