name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # The repository keeps no changelog file: since 0.0.1 the version
          # history is the commit history, so GitHub's own generator writes the
          # release body from the commits between this tag and the previous one.
          generate_release_notes: true
          draft: false
          prerelease: false

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name_arch: x86_64
            ext: ""
          - os: linux
            arch: arm64
            name_arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            name_arch: x86_64
            ext: ""
          - os: darwin
            arch: arm64
            name_arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            name_arch: x86_64
            ext: ".exe"
          - os: windows
            arch: arm64
            name_arch: arm64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Get version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install rsrc (Windows only)
        if: ${{ matrix.os == 'windows' }}
        run: go install github.com/akavel/rsrc@v0.10.2

      - name: Generate Windows icon resource (Windows only)
        if: ${{ matrix.os == 'windows' }}
        run: |
          go run ./cmd/modelfetch/genico.go
          # Go only links a .syso whose file name names the target, so this
          # follows matrix.arch rather than being hardcoded to amd64.
          rsrc -ico cmd/modelfetch/modelfetch.ico -o cmd/modelfetch/resource_windows_${{ matrix.arch }}.syso

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          # GOARCH stays amd64; the asset name uses name_arch (x86_64) instead.
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -o modelfetch_${{ matrix.os }}_${{ matrix.name_arch }}_${{ steps.version.outputs.tag }}${{ matrix.ext }} \
            ./cmd/modelfetch

      - name: Cleanup Windows resources (Windows only)
        if: ${{ matrix.os == 'windows' }}
        run: |
          rm -f cmd/modelfetch/resource_windows_*.syso cmd/modelfetch/modelfetch.ico

      - name: Upload raw binary
        if: ${{ matrix.os != 'darwin' }}
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: modelfetch_${{ matrix.os }}_${{ matrix.name_arch }}_${{ steps.version.outputs.tag }}${{ matrix.ext }}

      # Darwin slices are not release assets: they are staged here and merged
      # into the universal binary by the darwin-universal job below.
      - name: Stage darwin slice
        if: ${{ matrix.os == 'darwin' }}
        uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.arch }}
          path: modelfetch_${{ matrix.os }}_${{ matrix.name_arch }}_${{ steps.version.outputs.tag }}${{ matrix.ext }}
          retention-days: 1

  darwin-universal:
    name: Build darwin universal binary
    runs-on: ubuntu-latest
    needs: [create-release, build]
    steps:
      - name: Download darwin slices
        uses: actions/download-artifact@v7
        with:
          pattern: darwin-*
          merge-multiple: true
          path: darwin-slices

      - name: Install llvm (llvm-lipo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq llvm

      - name: Merge slices into universal binary
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          llvm-lipo -create \
            darwin-slices/modelfetch_darwin_x86_64_${TAG} \
            darwin-slices/modelfetch_darwin_arm64_${TAG} \
            -o modelfetch_darwin_universal_${TAG}
          chmod +x modelfetch_darwin_universal_${TAG}
          # Fail the job unless the fat binary really carries both slices.
          INFO="$(llvm-lipo -info modelfetch_darwin_universal_${TAG})"
          echo "$INFO"
          echo "$INFO" | grep -q x86_64
          echo "$INFO" | grep -q arm64

      - name: Upload universal binary
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: modelfetch_darwin_universal_${{ needs.create-release.outputs.tag }}

  linux-desktop:
    name: Build Linux RPM
    runs-on: ubuntu-latest
    needs: [create-release, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get version
        id: version
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Stage sources
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rpm-sources
          # Download linux x86_64 binary from release assets
          gh release download "$TAG" \
            -p "modelfetch_linux_x86_64_*" \
            -D /tmp/rpm-sources \
            -R "$REPO"
          # Rename to the exact Source0 name expected by the spec
          # (the spec still names its Source0 modelfetch_linux_amd64).
          mv /tmp/rpm-sources/modelfetch_linux_x86_64_* /tmp/rpm-sources/modelfetch_linux_amd64
          # Copy packaging files
          cp packaging/rpm/modelfetch.desktop /tmp/rpm-sources/
          cp packaging/rpm/modelfetch.svg /tmp/rpm-sources/
          cp LICENSE /tmp/rpm-sources/
          cp README.md /tmp/rpm-sources/
          ls -la /tmp/rpm-sources/

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rpmbuild -ba packaging/rpm/modelfetch.spec \
            --define "_sourcedir /tmp/rpm-sources" \
            --define "_rpmdir /tmp/rpm-output" \
            --define "_srcrpmdir /tmp/rpm-output" \
            --define "appversion ${VERSION}"

      - name: Upload RPM
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: /tmp/rpm-output/**/*.rpm

  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: [create-release, build, linux-desktop, darwin-universal]
    steps:
      - name: Download release assets
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh release download "$TAG" -D release-files -R "$REPO"

      - name: Generate checksums
        run: |
          cd release-files
          # Remove any previously published checksums.txt to avoid self-referential hashes
          rm -f checksums.txt
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: release-files/checksums.txt
